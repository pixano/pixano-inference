[project]
name = "pixano-inference-torch"
version = "0.1.0"
description = "PyTorch helpers shared by Pixano Inference model packages."
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
  "pixano-inference >= 0.6.0, < 0.7.0",
  "numpy >= 1.26.0, < 3.0.0",
  "torch >= 2.3.0, < 3.0.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv]
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[tool.uv.sources]
pixano-inference = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixano_inference_torch"]
