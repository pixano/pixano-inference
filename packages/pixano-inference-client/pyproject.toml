[project]
name = "pixano-inference-client"
version = "0.2.0"
description = "Deprecated alias: the Pixano Inference client and wire schemas ship in the base install of pixano-inference."
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
  # The base install of the core is the client: pydantic, numpy and httpx, no server stack.
  "pixano-inference >= 0.7.0, < 0.8.0",
]

[project.optional-dependencies]
masks = [
  "pixano-inference[masks] >= 0.7.0, < 0.8.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv.sources]
pixano-inference = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixano_inference_client"]
