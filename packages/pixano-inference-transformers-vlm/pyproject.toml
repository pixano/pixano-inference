[project]
name = "pixano-inference-transformers-vlm"
version = "0.1.0"
description = "Hugging Face Transformers vision-language models, packaged as a Pixano Inference plugin."
requires-python = ">=3.10,<3.14"
license = { file = "../../LICENSE" }
readme = "README.md"
dependencies = [
  "pixano-inference",
  "pixano-inference-torch",
  "accelerate >= 1.15.0",
  "bitsandbytes",
  "torch >= 2.3.0, < 3.0.0",
  "torchvision",
  "transformers >= 5.10.0, < 6.0.0",
]

# Discovery: Pixano Inference loads this entry point at startup, registering the model.
[project.entry-points."pixano_inference.models"]
transformers_vlm = "pixano_inference_transformers_vlm"

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv]
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[tool.uv.sources]
pixano-inference = { path = "../..", editable = true }
pixano-inference-torch = { path = "../pixano-inference-torch", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixano_inference_transformers_vlm"]
