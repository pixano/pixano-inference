[project]
name = "pixano-numpy-detector"
version = "0.1.0"
description = "Example framework-free (numpy-only) custom detection model for Pixano Inference."
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
  "pixano-inference",
  "numpy >= 1.26.0, < 3.0.0",
  "Pillow >= 9.0.0",
  "pydantic >= 2.0.0, < 3.0.0",
]

# This is what makes the model discoverable: Pixano Inference loads every entry point in the
# "pixano_inference.models" group at startup, which imports the module and runs @register_model.
[project.entry-points."pixano_inference.models"]
numpy_detector = "pixano_numpy_detector.model"

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv]
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[tool.uv.sources]
pixano-inference = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixano_numpy_detector"]
