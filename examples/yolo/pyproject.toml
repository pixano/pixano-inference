[project]
name = "pixano-yolo-detector"
version = "0.1.0"
description = "Ultralytics YOLO as a Pixano Inference custom-model plugin."
requires-python = ">=3.10"
license = { file = "../../LICENSE" }
dependencies = [
  "pixano-inference",
  # NOTE: ultralytics is AGPL-3.0. Deploying it as a network service carries source-disclosure
  # obligations (AGPL section 13). Review the licence before using it in production.
  "ultralytics",
]

[project.entry-points."pixano_inference.models"]
yolo_detector = "pixano_yolo.model"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixano_yolo"]
