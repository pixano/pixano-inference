name: Test Backend

on:
  push:
    paths:
      - "src/**"
      - "packages/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/test_back.yml"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
    branches:
      - "main"
  pull_request:
    paths:
      - "src/**"
      - "packages/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/test_back.yml"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
    branches:
      - "main"

permissions:
  contents: read

jobs:
  python_test:
    name: Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # The core is framework-free: it is tested with no ML framework installed. Every model
      # lives in its own package, tested by the `model_packages` job below.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The client is a hard core dep not yet on PyPI, so install it editable BEFORE `pip install .`.
          python -m pip install -e packages/pixano-inference-client
          python -m pip install .[test]
          python -m pip install -e examples/numpy_detector  # framework-free example entry-point plugin

      - name: Assert no ML framework is installed
        run: |
          python - <<'PY'
          import importlib.util
          present = [m for m in ("torch", "tensorflow", "jax", "mlx", "transformers", "vllm") if importlib.util.find_spec(m)]
          assert not present, f"the core must not pull ML frameworks: {present}"
          PY

      # Fast unit tests (the Ray Serve integration suite runs in its own job below).
      - name: Test with pytest
        run: |
          pytest --cov=pixano_inference --cov-report=xml -m "not integration" tests/
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v4.2.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Ray Serve integration (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Integration tests boot a real local Ray + Serve runtime with a numpy-only stub
      # model (no torch, no GPU) and exercise deploy -> RUNNING -> predict -> undeploy.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/pixano-inference-client  # hard core dep, not yet on PyPI
          python -m pip install .[test]
          python -m pip install -e examples/numpy_detector  # example entry-point plugin

      - name: Run integration tests
        run: |
          pytest -m integration tests/integration/

  model_packages:
    name: Model package ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/pixano-inference-torch
          - packages/pixano-inference-sam
          - packages/pixano-inference-clip
          - packages/pixano-inference-grounding-dino
          - packages/pixano-inference-transformers-vlm
          - packages/pixano-inference-vllm
          - examples/numpy_detector
          - examples/yolo
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each package is self-contained: its own pyproject.toml and uv.lock. Fail if the lock
      # is stale with respect to the pyproject.
      - name: Check the lock file is up to date
        run: uv lock --check

      # Install from the package's own metadata with CPU torch (the locked CUDA wheels are
      # several GB), then run its tests. vLLM needs a GPU, so its tests fake the `vllm` module
      # and everything but vllm itself is installed.
      - name: Install the package
        if: ${{ hashFiles(format('{0}/tests/**', matrix.package)) != '' }}
        run: |
          uv venv
          if [ "${{ matrix.package }}" = "packages/pixano-inference-vllm" ]; then
            uv pip install --torch-backend=cpu -e ../.. msgspec torch pytest
            uv pip install --no-deps -e .
          else
            uv pip install --torch-backend=cpu -e . pytest
          fi

      - name: Run the package tests
        if: ${{ hashFiles(format('{0}/tests/**', matrix.package)) != '' }}
        run: uv run --no-sync pytest -m "not integration"

      # The CLIP package's end-to-end test deploys MobileCLIP2 on a real (CPU) Ray Serve runtime.
      - name: Run the package integration tests
        if: ${{ matrix.package == 'packages/pixano-inference-clip' }}
        run: uv run --no-sync pytest -m integration

  install_from_source:
    name: Install a model package from source
    runs-on: ubuntu-latest
    steps:
      # Full history: uv fetches the git URL below from this checkout, and git cannot serve a
      # branch out of a shallow (depth-1) repository.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A model package never has to be published: it installs from its source, and `uv`
      # follows its [tool.uv.sources] to the core (and torch helpers) it depends on. Each
      # environment below ends with the server discovering the model through its entry point.
      - name: From a local directory
        run: |
          uv venv .venv-path
          VIRTUAL_ENV=$PWD/.venv-path uv pip install --torch-backend=cpu ./packages/pixano-inference-sam
          .venv-path/bin/python -c "from pixano_inference.plugins import load_plugin_models as l; r = l(); assert r == {'loaded': ['sam2'], 'failed': []}, r"

      # git+file:// stands in for a private repository; the subdirectory form is what a
      # monorepo of models needs. The checkout is a detached HEAD, so give uv a branch to fetch.
      # (The `git+file://` URL is only for CI; users install from their repository's URL.)
      - name: From a git URL with a subdirectory
        run: |
          git branch -f under-test HEAD
          uv venv .venv-git
          VIRTUAL_ENV=$PWD/.venv-git uv pip install --torch-backend=cpu "pixano-inference-sam @ git+file://$PWD@under-test#subdirectory=packages/pixano-inference-sam"
          .venv-git/bin/python -c "from pixano_inference.plugins import load_plugin_models as l; r = l(); assert r == {'loaded': ['sam2'], 'failed': []}, r"

      # Plain pip ignores uv sources, so every local package goes on the command line.
      - name: With pip, from local paths
        run: |
          python -m venv .venv-pip
          .venv-pip/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          .venv-pip/bin/pip install --quiet ./packages/pixano-inference-client . ./packages/pixano-inference-torch ./packages/pixano-inference-sam
          .venv-pip/bin/python -c "from pixano_inference.plugins import load_plugin_models as l; r = l(); assert r == {'loaded': ['sam2'], 'failed': []}, r"

  docker_smoke:
    name: Docker build & smoke (CPU, framework-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build a minimal, framework-free image (no torch, no SAM) with the numpy example
      # plugin, so the Dockerfile mechanics + entrypoint + healthcheck + Serve deploy path
      # are validated fast, without pulling multi-GB torch/sam-2.
      - name: Build minimal image
        run: |
          docker build \
            --build-arg TORCH_INDEX_URL= \
            --build-arg MODEL_PACKAGES= \
            --build-arg INSTALL_EXAMPLE=true \
            -t pixano-inference:smoke .

      - name: Run container and smoke-test /v1/ready
        run: |
          docker run -d --name pi -p 7463:7463 --shm-size=2g \
            -v "$PWD/docker/models.numpy.py:/config/models.py:ro" \
            pixano-inference:smoke --host 0.0.0.0 --port 7463 --config /config/models.py
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:7463/health >/dev/null 2>&1; then echo "healthy"; break; fi
            sleep 3
          done
          curl -fsS http://localhost:7463/v1/ready \
            | python3 -c "import sys, json; d = json.load(sys.stdin); print(d); sys.exit(0 if d['ready'] else 1)" \
            || (docker logs pi; exit 1)
          docker rm -f pi

  openapi:
    name: OpenAPI schema in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate the schema in the LOCKED environment (uv.lock) so the check is deterministic:
      # a fresh `pip install` resolves newer FastAPI/pydantic that emit a subtly different schema
      # than the committed docs/openapi.json (which is generated against the lockfile).
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the committed OpenAPI schema is in sync
        run: |
          uv sync --no-default-groups
          uv run python scripts/gen_openapi.py --check

  client_standalone:
    name: Standalone client (no server deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Install ONLY the standalone client (no core, no ray/fastapi/torch). Its tests assert the
      # import pulls in no heavy modules — the acceptance proof that third-party callers get a
      # small install. Also confirm the whole server stack is genuinely absent.
      - name: Install the client only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pixano-inference-client[masks]"
          python -m pip install pytest

      - name: Assert the server stack is not installed
        run: |
          python - <<'PY'
          import importlib.util
          for mod in ["ray", "fastapi", "uvicorn", "torch", "pixano_inference"]:
              assert importlib.util.find_spec(mod) is None, f"{mod} should not be installed"
          import pixano_inference_client
          print("standalone client OK:", pixano_inference_client.PixanoInferenceClient)
          PY

      - name: Run the client package tests
        run: |
          pytest packages/pixano-inference-client/tests -v
