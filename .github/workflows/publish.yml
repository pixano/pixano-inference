name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

# Every distribution of this repository goes to PyPI, in dependency order: the client (a hard
# dependency of the core), then the torch helpers and the model packages (they depend on the
# core by name only, resolved at install time), and the core last, so a run that fails midway
# never leaves a core on PyPI whose extras cannot resolve. Each PyPI project needs a trusted
# publisher for this workflow (repository pixano/pixano-inference, workflow publish.yml).
jobs:
  check_version:
    name: Release tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare the tag with src/pixano_inference/__version__.py
        run: |
          version=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/pixano_inference/__version__.py)
          tag="${{ github.event.release.tag_name }}"
          if [ "${tag#v}" != "$version" ]; then
            echo "release tag '$tag' does not match __version__ '$version'"
            exit 1
          fi

  publish_client:
    name: Publish pixano-inference-client
    runs-on: ubuntu-latest
    needs: check_version
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Build
        working-directory: packages/pixano-inference-client
        run: hatch build

      # The client keeps its own version; a release of the core that does not change it
      # skips the upload instead of failing on the existing files.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pixano-inference-client/dist
          skip-existing: true

  publish_packages:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: publish_client
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - pixano-inference-torch
          - pixano-inference-sam
          - pixano-inference-clip
          - pixano-inference-grounding-dino
          - pixano-inference-transformers-vlm
          - pixano-inference-vllm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Build
        working-directory: packages/${{ matrix.package }}
        run: hatch build

      # Model packages are versioned on their own; unchanged ones are skipped, not failed.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ matrix.package }}/dist
          skip-existing: true

  publish_core:
    name: Publish pixano-inference
    runs-on: ubuntu-latest
    needs: publish_packages
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch

      - name: Build
        run: hatch build

      # No skip-existing here: a release must carry a new core version.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy_docs:
    name: Publish documentation website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set VERSION environment variable
        run: echo "VERSION=$(grep -oP '__version__\s*=\s*"\K[0-9a-zA-Z]+\.[0-9a-zA-Z]+\.[0-9a-zA-Z]+' src/pixano_inference/__version__.py)" >> $GITHUB_ENV

      - name: Configure git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create cache_id for key creation
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Create cache key with cache_id
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: |
          pip install -e packages/pixano-inference-client  # hard core dep, not yet on PyPI
          pip install .[docs]

      - name: Publish documentation website
        run: mike deploy --push --update-aliases ${{ env.VERSION }} stable
