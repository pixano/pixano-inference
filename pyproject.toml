[project]
name = "pixano-inference"
description = "Deploy inference models served for Artificial Intelligence solutions including but not limited to Pixano."
keywords = [
  "computer vision",
  "inference",
  "natural language processing",
  "nlp",
  "machine learning",
  "deep learning",
  "pytorch",
]
authors = [
  { name="Julien Denize", email="julien.denize@cea.fr" },
]
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
  "typer >= 0.9.0",
  "fastapi >= 0.100.0",
  "httpx",
  "numpy < 2.0.0",
  "pydantic >= 2.0.0, < 3.0.0",
  "pydantic_settings",
  "Pillow >= 9.0.0",
  "pycocotools",
  "python-dotenv~=1.0.1",
  "python-multipart",
  "requests",
  "uvicorn >= 0.31.0",
  "ray[serve] >= 2.53.0, < 3.0.0",
  "pyyaml >= 6.0.0",
]
readme = "README.md"

[project.optional-dependencies]
docs=[
  "mike >= 2.1.0, < 3.0.0",
  "mkdocs >= 1.6.0, < 2.0.0",
  "mkdocs-material >= 9.5.0, < 10.0.0",
  "mkdocstrings-python >= 1.7.0",
  "mkdocs-gen-files >= 0.5.0",
  "mkdocs-literate-nav >= 0.6.0",
  "mkdocs-redirects >= 1.2.1",
]
# NOTE: the SAM2 backend requires the `sam-2` package, which is only distributed from
# git (not PyPI). PyPI forbids wheels whose metadata carries a direct/VCS reference, so
# it cannot live in a published extra. Install it manually alongside this extra:
#   pip install pixano-inference[sam2]
#   pip install "sam-2 @ git+https://github.com/facebookresearch/sam2.git"
# (The dev dependency-group below installs it automatically for local development.)
sam2 = [
  "torch >= 2.3.0, < 3.0.0",
]
# Placeholder for future SAM3 integration
sam3 = []
# --- ML framework runtimes (optional). The core depends on none of these; a custom model
# is written against exactly one of them. Model-backend extras below (sam2, transformers,
# vllm, ultralytics) pull in the framework they need. ---
torch=[
  "torch >= 2.3.0, < 3.0.0",
]
jax=[
  "jax >= 0.4.0",
]
tensorflow=[
  "tensorflow >= 2.13.0",
]
mlx=[
  "mlx >= 0.1.0; sys_platform == 'darwin'",
]
transformers=[
  "accelerate",
  "bitsandbytes",
  "torch >= 2.3.0, < 3.0.0",
  "torchvision",
  "transformers >= 4.0.0, < 5.0.0",
]
test=[
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest_httpx",
  "pytest-mock",
  "responses",
]
ultralytics=[
  "ultralytics",
]
vllm=[
  "vllm >= 0.6.0; sys_platform == 'linux'",
]

[project.scripts]
pixano-inference = "pixano_inference.main:app"

[project.urls]
"Homepage" = "https://github.com/pixano/pixano-inference"
"Documentation" = "https://pixano.github.io/pixano-inference/"
"Source Code" = "https://github.com/pixano/pixano-inference"
"Bug Tracker" = "https://github.com/pixano/pixano-inference/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore=["C901"]
select = ["C", "E", "F", "I", "W", "D"]
ignore-init-module-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "C408", "C901", "F401"]
"docs/*" = ["D", "F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["pixano_inference"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "integration: end-to-end tests that start a real Ray/Serve runtime (deselect with '-m \"not integration\"')",
]

[tool.hatch.version]
path = "src/pixano_inference/__version__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = ["dev"]

environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pixano-inference[test,docs,transformers,sam2]",
  # sam-2 lives here (a dependency-group, which is never published to PyPI) rather than
  # in the [sam2] extra, so the published wheel carries no direct/VCS reference.
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git",
]
