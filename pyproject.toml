[project]
name = "pixano-inference"
description = "Deploy inference models served for Artificial Intelligence solutions including but not limited to Pixano."
keywords = [
  "computer vision",
  "inference",
  "natural language processing",
  "nlp",
  "machine learning",
  "deep learning",
  "pytorch",
  "jax",
  "mlx"
]
authors = [
  { name="Jaonary Rabarisoa", email="jaonary.rabarisoa@cea.fr" },
  { name="Julien Denize", email="julien.denize@cea.fr" },
]
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
  "pixano-inference-client[masks]",
  "typer >= 0.9.0",
  "fastapi >= 0.100.0",
  "numpy >= 1.26.0, < 3.0.0",
  "pydantic >= 2.0.0, < 3.0.0",
  "pydantic_settings >= 2.14.2",
  "Pillow >= 12.3.0",
  "pycocotools",
  "python-dotenv >= 1.2.2, < 2.0.0",
  "python-multipart >= 0.0.30",
  "requests >= 2.33.0",
  "uvicorn >= 0.31.0",
  "ray[serve] >= 2.56.0, < 3.0.0",
  "jinja2 >= 3.1.6",
  "pyyaml >= 6.0.0",
  "prometheus-client >= 0.16.0",
]
readme = "README.md"

[project.optional-dependencies]
docs=[
  "mike >= 2.1.0, < 3.0.0",
  "mkdocs >= 1.6.0, < 2.0.0",
  "mkdocs-material >= 9.5.0, < 10.0.0",
  "mkdocstrings-python >= 1.7.0",
  "mkdocs-gen-files >= 0.5.0",
  "mkdocs-literate-nav >= 0.6.0",
  "mkdocs-redirects >= 1.2.1",
]
test=[
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest_httpx",
  "pytest-mock",
  "responses",
]

[project.scripts]
pixano-inference = "pixano_inference.main:app"

[project.urls]
"Homepage" = "https://github.com/pixano/pixano-inference"
"Documentation" = "https://pixano.github.io/pixano-inference/"
"Source Code" = "https://github.com/pixano/pixano-inference"
"Bug Tracker" = "https://github.com/pixano/pixano-inference/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119
extend-exclude = ["deploy"]
force-exclude = true

[tool.ruff.lint]
ignore=["C901"]
select = ["C", "E", "F", "I", "W", "D"]
ignore-init-module-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "C408", "C901", "F401"]
"packages/*/tests/*" = ["D", "C408", "C901", "F401"]
"examples/*/tests/*" = ["D", "C408", "C901", "F401"]
"docs/*" = ["D", "F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["pixano_inference"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "integration: end-to-end tests that start a real Ray/Serve runtime (deselect with '-m \"not integration\"')",
]

[tool.hatch.version]
path = "src/pixano_inference/__version__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = ["dev"]

environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pixano-inference[test,docs]",
  "pixano-numpy-detector",
]

[tool.uv.sources]
pixano-inference-client = { path = "packages/pixano-inference-client", editable = true }
pixano-numpy-detector = { path = "examples/numpy_detector", editable = true }
